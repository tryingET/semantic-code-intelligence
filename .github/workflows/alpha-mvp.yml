name: Alpha MVP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Portable repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: ./scripts/ci/portable.sh

  alpha-mvp-check:
    name: Harnessed-LLM Alpha MVP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run alpha:mvp:check
      - name: Local production-candidate packaged-runtime gate
        run: bun run production:candidate:check
      - name: Upload allowlisted sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sci-validation-evidence-${{ github.sha }}
          path: |
            .test-results/alpha-evidence-packet.json
            .test-results/local-production-candidate.json
          if-no-files-found: ignore
          retention-days: 14

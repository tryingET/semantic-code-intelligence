# Semantic Code Intelligence Production Deployment
# All-in-one file for production deployment
# Apply with: kubectl apply -f production.yaml

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: semantic-code-intelligence
  labels:
    name: semantic-code-intelligence
    app.kubernetes.io/name: semantic-code-intelligence

---
# Service Account and RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: semantic-code-intelligence-sa
  namespace: semantic-code-intelligence
  labels:
    app.kubernetes.io/name: semantic-code-intelligence
    app.kubernetes.io/component: rbac

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: semantic-code-intelligence-role
  namespace: semantic-code-intelligence
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: semantic-code-intelligence-rolebinding
  namespace: semantic-code-intelligence
subjects:
  - kind: ServiceAccount
    name: semantic-code-intelligence-sa
    namespace: semantic-code-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: semantic-code-intelligence-role

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: semantic-code-intelligence-config
  namespace: semantic-code-intelligence
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  HTTP_API_PORT: "7000"
  MCP_HTTP_PORT: "7001"
  LSP_SERVER_PORT: "7002"
  CACHE_TTL: "3600"
  PERFORMANCE_MONITORING: "true"
  PATTERN_LEARNING: "true"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "semantic-code-intelligence"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-code-intelligence
  namespace: semantic-code-intelligence
  labels:
    app.kubernetes.io/name: semantic-code-intelligence
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-code-intelligence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-code-intelligence
        app.kubernetes.io/version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: semantic-code-intelligence-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: semantic-code-intelligence
          image: semantic-code-intelligence:2.0.0
          ports:
            - containerPort: 7000
              name: http-api
            - containerPort: 7001
              name: mcp-http
            - containerPort: 7002
              name: lsp-tcp
          envFrom:
            - configMapRef:
                name: semantic-code-intelligence-config
            - secretRef:
                name: semantic-code-intelligence-secrets
                optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 7000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir:
            sizeLimit: 2Gi

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: semantic-code-intelligence-http
  namespace: semantic-code-intelligence
  labels:
    app.kubernetes.io/name: semantic-code-intelligence
    app.kubernetes.io/component: http-api
spec:
  type: ClusterIP
  ports:
    - port: 7000
      targetPort: 7000
      name: http
  selector:
    app.kubernetes.io/name: semantic-code-intelligence

---
apiVersion: v1
kind: Service
metadata:
  name: semantic-code-intelligence-mcp
  namespace: semantic-code-intelligence
  labels:
    app.kubernetes.io/name: semantic-code-intelligence
    app.kubernetes.io/component: mcp-http
spec:
  type: ClusterIP
  ports:
    - port: 7001
      targetPort: 7001
      name: mcp-http
  selector:
    app.kubernetes.io/name: semantic-code-intelligence

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: semantic-code-intelligence-hpa
  namespace: semantic-code-intelligence
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: semantic-code-intelligence
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: semantic-code-intelligence-pdb
  namespace: semantic-code-intelligence
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-code-intelligence

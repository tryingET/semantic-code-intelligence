name: Alpha MVP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  alpha-mvp-check:
    name: Phase 1 harnessed-LLM Alpha MVP validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Alpha MVP validation
        run: bun run alpha:mvp:check

      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-mvp-dogfood
          path: .test-results/alpha-mvp-dogfood.json
          if-no-files-found: ignore

name: CI

on:
  push:
    branches: [main, unified-core-architecture]
  pull_request:
    branches: [main, unified-core-architecture]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      run_perf:
        description: "Run PERF-gated performance/benchmarks suite"
        type: boolean
        default: false
      run_e2e:
        description: "Run gated E2E suite"
        type: boolean
        default: false

# Cancel previous workflow runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.2.20"
  NODE_VERSION: "20"

jobs:
  quality:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changeset detection

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            vscode-client/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd vscode-client && npm ci

      - name: Type checking
        run: |
          echo "🔍 Type checking main project..."
          bun run build:tsc
          echo "🔍 Type checking VS Code extension..."
          cd vscode-client && npm run compile

      - name: Linting and formatting
        run: |
          echo "🧹 Running Biome linting..."
          bun run lint
          echo "🧹 Checking VS Code extension..."
          cd vscode-client && npm run lint

      - name: Unit Tests
        run: |
          echo "🧪 Running unit tests..."
          bun test tests/step*.test.ts tests/test-helpers.test.ts --timeout 120000

      - name: SQLite-only Core Suites (L4 + adapters + integration)
        env:
          LAYER4_ADAPTER: sqlite
          ONTOLOGY_PG_URL: ""
          DATABASE_URL: ""
          PG_URL: ""
          TRIPLESTORE_URL: ""
        run: |
          echo "🧪 Running sqlite-only core suites (layer4 + adapters + integration)..."
          bun test tests/layer4-*.test.ts tests/storage-adapters.test.ts tests/adapters.test.ts tests/unified-core.test.ts tests/integration.test.ts --timeout 120000

      - name: Advanced Integration Tests
        run: |
          echo "🧪 Running advanced integration tests..."
          bun test tests/learning-system.test.ts --timeout 120000
        continue-on-error: true  # These tests are in improvement state (60%+ passing)

      - name: HTTP Smoke (metrics + learning-stats)
        run: |
          echo "🌐 Starting HTTP server for smoke tests..."
          (timeout 30s bun run src/servers/http.ts > http-smoke.log 2>&1 & echo $! > http-smoke.pid)
          for i in {1..30}; do curl -sf http://localhost:7000/health >/dev/null && echo "HTTP up" && break || sleep 1; done
          echo "📈 /metrics JSON"
          curl -sSf http://localhost:7000/metrics?format=json | jq '.l4 | keys' || (echo "No metrics" && true)
          echo "🧠 /api/v1/learning-stats"
          curl -sSf http://localhost:7000/api/v1/learning-stats | jq '.data.patterns' || true
          echo "🛑 Stopping HTTP server"
          kill $(cat http-smoke.pid) 2>/dev/null || true

      - name: Dogfood (HTTP tools) summary
        run: |
          echo "🥣 Running dogfood_ci (HTTP tools)"
          just dogfood_ci | tee dogfood-summary.json
          jq . dogfood-summary.json >/dev/null

      - name: Upload dogfood summary
        uses: actions/upload-artifact@v4
        with:
          name: dogfood-summary
          path: dogfood-summary.json
          retention-days: 7

      - name: Performance Tests (gated)
        if: ${{ inputs.run_perf == true || vars.RUN_PERF == '1' }}
        run: |
          echo "⚡ Running PERF-gated performance benchmarks in batches..."
          chmod +x bin/test-run-perf-and-analyze.sh
          # Calibrate Layer 2 AST parse cap to stabilize p95 in CI
          # See NEXT_STEPS 0.1 and CONFIG.md (L2_MAX_PARSE_FILES)
          PERF=1 L2_MAX_PARSE_FILES=12 TIMEOUT=180000 BUN_JOBS=1 bin/test-run-perf-and-analyze.sh

      - name: Upload PERF artifacts
        if: ${{ inputs.run_perf == true || vars.RUN_PERF == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: .test-results-perf/
          retention-days: 7

      - name: Consistency Tests
        run: |
          echo "🔄 Running cross-protocol consistency tests..."
          bun test tests/consistency.test.ts --timeout 180000

      - name: VS Code Extension Tests
        run: |
          echo "🧪 Running VS Code extension tests..."
          cd vscode-client && npm test

      # Coverage moved to dedicated job to avoid duplication

  tests-sliced:
    name: Tests (Sliced Matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            vscode-client/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd vscode-client && npm ci

      - name: Run sliced tests with batch progress
        env:
          SLICES: 6
          SLICE: ${{ matrix.slice }}
          BATCH_SIZE: 10
          TIMEOUT: 180000
          BUN_JOBS: 1
        run: |
          echo "🧪 Running test slice $SLICE/$SLICES (batched)"
          chmod +x bin/test-slicer.sh bin/test-progress-batch.sh
          bin/test-slicer.sh | tee ".test-results/slice-${SLICE}.log"

      - name: Upload slice artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.slice }}
          path: |
            .test-results/slice-${{ matrix.slice }}.log
            .test-results/slice-${{ matrix.slice }}-of-6/files.lst
            .test-results/slice-${{ matrix.slice }}-of-6/batch-report.jsonl
          if-no-files-found: ignore
          retention-days: 7

      - name: Slice summary
        run: |
          echo "# 🧪 Test Slice $SLICE/$SLICES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Batch size: ${BATCH_SIZE}" >> $GITHUB_STEP_SUMMARY
          echo "- Timeout (per bun): ${TIMEOUT} ms" >> $GITHUB_STEP_SUMMARY
          echo "- Files: $(wc -l < .test-results/slice-${SLICE}-of-6/files.lst 2>/dev/null || echo 0)" >> $GITHUB_STEP_SUMMARY
          PASSES=$(grep -c "^(pass)" .test-results/slice-${SLICE}.log 2>/dev/null || echo 0)
          SKIPS=$(grep -c "^(skip)" .test-results/slice-${SLICE}.log 2>/dev/null || echo 0)
          FAILS=$(grep -c "^(fail)" .test-results/slice-${SLICE}.log 2>/dev/null || echo 0)
          echo "- Results: ${PASSES} pass, ${SKIPS} skip, ${FAILS} fail" >> $GITHUB_STEP_SUMMARY
      - name: Analyze batch report (slice)
        env:
          WARN_MS: 120000
          WARN_MAX: ${{ vars.WARN_MAX_MAIN }}
          FAIL_ON_SLOW: ${{ vars.FAIL_ON_SLOW_MAIN }}
        run: |
          bun run scripts/analyze-batch-report.ts .test-results/slice-${SLICE}-of-6/batch-report.jsonl >> $GITHUB_STEP_SUMMARY || true

  analyze-slices:
    name: Analyze Slices (Aggregate)
    runs-on: ubuntu-latest
    needs: tests-sliced
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Download slice artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          path: slices
          merge-multiple: false
      - name: Aggregate analysis
        env:
          WARN_MS: 120000
          WARN_MAX: ${{ vars.WARN_MAX_MAIN }}
          FAIL_ON_SLOW: ${{ vars.FAIL_ON_SLOW_MAIN }}
        run: |
          bun run scripts/analyze-slices.ts slices | tee slices/aggregate-summary.md
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 🧪 Aggregate Slice Analysis" >> $GITHUB_STEP_SUMMARY
          cat slices/aggregate-summary.md >> $GITHUB_STEP_SUMMARY
      - name: Upload aggregate analysis
        uses: actions/upload-artifact@v4
        with:
          name: slices-aggregate
          path: slices/aggregate-summary.md
          retention-days: 7

  build:
    name: Build Production Artifacts
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            vscode-client/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package-lock.json') }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd vscode-client && npm ci

      - name: Build production artifacts
        run: |
          echo "🔨 Building production artifacts..."
          bun run build:tsc
          bun run build:all

      - name: Build VS Code extension
        run: |
          echo "🔨 Building VS Code extension..."
          cd vscode-client
          npm run compile
          npx @vscode/vsce package

      - name: Test production builds
        run: |
          echo "🧪 Testing production builds..."
          # Test that builds can be executed
          timeout 10s bun run dist/http/http.js --port 7003 &
          sleep 5
          curl -f http://localhost:7003/health || echo "Health check failed but continuing..."
          pkill -f "dist/http/http.js" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-builds
          path: |
            dist/
            vscode-client/*.vsix
          retention-days: 30

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: bundle-analysis
          path: |
            dist/**/*.js.map
          retention-days: 7

  docker:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ontology-lsp
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.ref == 'refs/heads/main'
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/ontology-lsp:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: github.ref == 'refs/heads/main'
        with:
          sarif_file: 'trivy-results.sarif'

  health-check:
    name: Integration Health Check
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-builds
          path: .

      - name: Start servers for integration testing
        run: |
          echo "🚀 Starting servers for integration test..."
          mkdir -p .ontology/pids .ontology/logs
          
          # Start HTTP API server
          timeout 30s bun run dist/api/http.js --port 7000 > .ontology/logs/http.log 2>&1 &
          echo $! > .ontology/pids/http.pid
          
          # Start MCP SSE server  
          timeout 30s bun run dist/mcp-sse/mcp-sse.js --port 7001 > .ontology/logs/mcp.log 2>&1 &
          echo $! > .ontology/pids/mcp.pid
          
          # Wait for servers to start
          sleep 10

      - name: Run health checks
        run: |
          echo "🩺 Running health checks..."
          
          # Check HTTP API
          curl -f http://localhost:7000/health --max-time 10 || exit 1
          echo "✅ HTTP API health check passed"
          
          # Check MCP SSE server
          curl -f http://localhost:7001/health --max-time 10 || exit 1
          echo "✅ MCP SSE health check passed"
          
          # Test basic functionality
          curl -f http://localhost:7000/stats --max-time 10 | jq . || exit 1
          echo "✅ API functionality test passed"

      - name: Cleanup
        if: always()
        run: |
          # Stop background processes
          [ -f .ontology/pids/http.pid ] && kill $(cat .ontology/pids/http.pid) 2>/dev/null || true
          [ -f .ontology/pids/mcp.pid ] && kill $(cat .ontology/pids/mcp.pid) 2>/dev/null || true
          # Clean up any remaining processes
          pkill -f "dist/" || true

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [quality, tests-sliced, analyze-slices, coverage, build, docker, health-check, e2e-sliced]
    if: always() && github.event_name == 'push'

    steps:
      - name: Create job summary
        run: |
          echo "# 🚀 Ontology-LSP CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality & Testing | ${{ needs.quality.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sliced Tests | ${{ needs.tests-sliced.result == 'success' && '✅ Passed' || needs.tests-sliced.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Slices Analysis | ${{ needs.analyze-slices.result == 'success' && '✅ Done' || needs.analyze-slices.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result == 'success' && '✅ Passed' || needs.coverage.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E (Sliced) | ${{ needs.e2e-sliced.result == 'success' && '✅ Passed' || needs.e2e-sliced.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: tests-sliced
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate coverage (single run)
        run: |
          echo "📊 Generating test coverage in a dedicated job..."
          bun test --coverage tests/ --timeout 300000

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          echo "| Docker | ${{ needs.docker.result == 'success' && '✅ Passed' || needs.docker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result == 'success' && '✅ Passed' || needs.health-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
      - name: Append slow batch highlights (aggregate)
        uses: actions/download-artifact@v4
        with:
          name: slices-aggregate
          path: slices-aggregate
        continue-on-error: true
      - name: Show highlights
        if: always()
        run: |
          if [ -f slices-aggregate/aggregate-summary.md ]; then \
            echo "" >> $GITHUB_STEP_SUMMARY; \
            echo "## 🐢 Slow Batch Highlights" >> $GITHUB_STEP_SUMMARY; \
            head -n 30 slices-aggregate/aggregate-summary.md >> $GITHUB_STEP_SUMMARY; \
          else \
            echo "" >> $GITHUB_STEP_SUMMARY; \
            echo "(No aggregate summary to display)" >> $GITHUB_STEP_SUMMARY; \
          fi

  e2e:
    name: Gated E2E Suite
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ inputs.run_e2e == true || vars.RUN_E2E == '1' }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E tests (gated)
        env:
          E2E: '1'
          USE_LOCAL_REPOS: 'true'
          E2E_SKIP_CLONE: 'true'
          E2E_MEMORY_LIMIT: '2048'
        run: |
          echo "🧪 Running E2E tests (gated)..."
          bun test tests/e2e/ --timeout 600000

      - name: Upload E2E results (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            tests/e2e/results/**
          if-no-files-found: ignore
          retention-days: 7

  e2e-sliced:
    name: Gated E2E (Sliced)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ inputs.run_e2e == true || vars.RUN_E2E == '1' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E slice with batch progress
        env:
          SLICES: 2
          SLICE: ${{ matrix.slice }}
          SUITE_DIR: tests/e2e
          BATCH_SIZE: 6
          TIMEOUT: 900000
          BUN_JOBS: 1
          E2E: '1'
          USE_LOCAL_REPOS: 'true'
          E2E_SKIP_CLONE: 'true'
          E2E_MEMORY_LIMIT: '2048'
        run: |
          echo "🔬 E2E slice $SLICE/$SLICES (batched)"
          chmod +x bin/test-slicer.sh bin/test-progress-batch.sh
          bin/test-slicer.sh | tee ".test-results/e2e-slice-${SLICE}.log"

      - name: Analyze E2E batch report (slice)
        env:
          WARN_MS: 300000
          WARN_MAX: ${{ vars.WARN_MAX_E2E }}
          FAIL_ON_SLOW: ${{ vars.FAIL_ON_SLOW_E2E }}
        run: |
          bun run scripts/analyze-batch-report.ts .test-results/slice-${SLICE}-of-2/batch-report.jsonl >> $GITHUB_STEP_SUMMARY || true

      - name: Upload E2E slice artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-slice-${{ matrix.slice }}
          path: |
            .test-results/e2e-slice-${{ matrix.slice }}.log
            .test-results/slice-${{ matrix.slice }}-of-2/files.lst
            .test-results/slice-${{ matrix.slice }}-of-2/batch-report.jsonl
          if-no-files-found: ignore
          retention-days: 7
